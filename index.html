<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Professional Resume Editor - Ultimate Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-dark: #1a2a3a; --accent-color: #c0392b; --border-color: #d1d5db; --bg-editor: #f3f4f6; --text-main: #374151; --text-light: #6b7280; }
        body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg-editor); margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; }

        /* 編輯面板 */
        .editor-panel { width: 480px; background: white; padding: 25px; height: 100vh; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 10; flex-shrink: 0; box-sizing: border-box; }
        .control-group { background: #f9fafb; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #eee; }
        h3 { font-size: 16px; color: var(--primary-dark); border-bottom: 2px solid #eee; padding-bottom: 8px; margin: 25px 0 15px; }
        .input-item { margin-bottom: 12px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--text-light); }
        input, select, textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 14px; box-sizing: border-box; font-family: inherit; }
        
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; }
        .checkbox-group input { width: auto; cursor: pointer; }

        /* 技能拖拉 */
        .skill-list-editor { list-style: none; padding: 0; margin: 10px 0; border: 1px solid #eee; border-radius: 4px; }
        .skill-item-editor { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid #eee; background: white; cursor: grab; font-size: 14px; }
        .skill-item-editor.dragging { opacity: 0.5; background: #f0f0f0; }

        .dynamic-list-item { background: #fff; border: 1px solid #e5e7eb; padding: 12px; border-radius: 6px; margin-bottom: 10px; position: relative; }
        .btn-add { background: var(--primary-dark); color: white; border: none; padding: 6px 15px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-top: 5px; font-weight: bold; }
        .btn-remove { color: #ef4444; cursor: pointer; font-size: 12px; position: absolute; top: 10px; right: 10px; font-weight: bold; }

        /* 預覽區 - 直接分頁結構 */
        .preview-scroll { flex-grow: 1; height: 100vh; overflow-y: auto; background: #525659; padding: 40px 0; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        
        /* A4 紙張本體 */
        .preview-container { 
            width: 210mm; 
            min-height: 297mm; 
            background: white; 
            padding: 20mm; 
            box-shadow: 0 0 20px rgba(0,0,0,0.3); 
            box-sizing: border-box; 
            position: relative;
        }
        
        /* 內容樣式 */
        .resume-header-flex { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid var(--primary-dark); padding-bottom: 15px; margin-bottom: 20px; }
        .photo-view { width: 100px; height: 120px; object-fit: cover; border: 1px solid #eee; border-radius: 4px; display: none; margin-left: 20px; }
        .photo-view.active { display: block; }
        .resume-name { font-size: 32px; font-weight: 700; color: var(--primary-dark); margin: 0; }
        .resume-contact { font-size: 13px; color: var(--text-light); margin-top: 8px; display: flex; gap: 15px; flex-wrap: wrap; }
        .section-header { font-size: 16px; font-weight: 700; color: var(--primary-dark); background: #f3f4f6; padding: 6px 12px; margin: 20px 0 10px; text-transform: uppercase; }
        .item-row { display: flex; justify-content: space-between; font-weight: 700; color: var(--text-main); margin-top: 12px; font-size: 14px; }
        .item-sub { color: var(--accent-color); font-size: 13px; font-weight: 600; margin-bottom: 4px; }
        .item-desc { font-size: 13px; line-height: 1.6; white-space: pre-line; color: var(--text-main); margin-bottom: 10px; }
        .entry-block { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #eee; }
        .entry-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .skill-tags-view { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
        .skill-tag-resume { font-size: 12px; color: white; background: var(--primary-dark); padding: 4px 10px; border-radius: 12px; }

        .btn-print { background: #2ecc71; color: white; width: 100%; padding: 15px; font-size: 16px; margin-top: 30px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        .btn-reset { background: white; color: #ef4444; border: 1px solid #ef4444; width: 100%; padding: 10px; font-size: 14px; margin-top: 10px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .backup-row { display: flex; gap: 10px; margin-top: 10px; }
        .btn-backup { background: white; color: var(--primary-dark); border: 1px solid var(--primary-dark); flex: 1; padding: 10px; font-size: 14px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .hidden { display: none !important; }

        /* 列印模式優化 */
        @media print {
            body { background: white !important; display: block !important; height: auto !important; overflow: visible !important; }
            .editor-panel { display: none !important; }
            .preview-scroll { display: block !important; background: white !important; padding: 0 !important; margin: 0 !important; overflow: visible !important; height: auto !important; width: 100% !important; }
            .preview-container { 
                box-shadow: none !important; 
                width: 210mm !important; 
                padding: 15mm !important; 
                margin: 0 auto !important; 
                page-break-after: always !important; /* 強制分頁核心 */
                border: none !important;
                display: block !important;
            }
            /* 最後一頁不需要強行分頁 */
            .preview-container:last-child { page-break-after: auto !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
</head>
<body>

<div class="editor-panel">
    <div class="control-group">
        <label id="labelDisplay">介面與顯示設定</label>
        <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px">
            <input type="color" id="colorPicker" value="#1a2a3a" oninput="updateThemeColor(this.value)">
            <span style="font-size:12px">自訂主題顏色</span>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="langToggle" onchange="updateLanguage(this.checked)">
            <label id="labelTextLang">使用英文界面 (English)</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="togglePhoto" checked onchange="togglePhotoVisibility(this.checked)">
            <label id="labelShowPhoto">顯示大頭貼</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="toggleSalary" checked onchange="toggleSalaryVisibility(this.checked)">
            <label id="labelShowSalary">顯示期待薪資</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="togglePF" checked onchange="togglePFVisibility(this.checked)">
            <label id="labelShowPF">顯示作品集網址</label>
        </div>
    </div>

    <h3 id="labelPersonal">個人資訊</h3>
    <div class="input-item"><label>大頭貼上傳</label><input type="file" accept="image/*" onchange="handlePhoto(this)"></div>
    <div class="input-item"><label id="labelName">姓名</label><input type="text" id="inputName" value="ALEX CHEN" oninput="sync('preName', this.value)"></div>
    <div class="input-item"><label id="labelEmail">Email</label><input type="text" id="inputEmail" value="alex.chen@example.com" oninput="sync('preEmail', this.value)"></div>
    <div class="input-item"><label id="labelPhone">電話</label><input type="text" id="inputPhone" placeholder="0912-345-678" oninput="updatePhone(this.value)"></div>
    <div class="input-item"><label id="labelSalaryIn">期待年薪</label><input type="number" id="inputSalary" placeholder="800000" oninput="updateSalary(this.value)"></div>
    <div class="input-item"><label id="labelMilitary">兵役狀況（選填）</label><select id="inputMilitary" onchange="updateMilitary(this.value)"></select></div>

    <h3 id="labelSummaryTitle">自我簡介 & 技能</h3>
    <div class="input-item"><textarea id="inputSummary" rows="4" oninput="sync('preSummary', this.value)"></textarea></div>
    <div class="input-item">
        <div style="display:flex; gap:5px"><input type="text" id="skillInput" placeholder="新增技能"><button onclick="addSkill()">新增</button></div>
        <ul class="skill-list-editor" id="skillListEditor"></ul>
    </div>

    <h3 id="labelExpHeader">工作經歷</h3>
    <div id="expListEditor"></div>
    <button class="btn-add" onclick="addItem('exp')">+ 新增經歷</button>

    <h3 id="labelEduHeader">教育程度</h3>
    <div id="eduListEditor"></div>
    <button class="btn-add" onclick="addItem('edu')">+ 新增教育</button>

    <h3 id="labelPortfolio">作品集網址</h3>
    <div id="pfListEditor"></div>
    <button class="btn-add" id="btnAddPF" onclick="addPF()">+ 新增連結</button>

    <button class="btn-print" onclick="window.print()">下載 / 儲存 PDF</button>
    <div class="backup-row">
        <button class="btn-backup" onclick="exportJSON()">匯出備份 (JSON)</button>
        <button class="btn-backup" onclick="document.getElementById('importFile').click()">匯入備份</button>
    </div>
    <input type="file" id="importFile" accept=".json,application/json" class="hidden" onchange="importJSON(this)">
    <button class="btn-reset" onclick="clearAllData()">清除資料 / 重設</button>
</div>

<div class="preview-scroll">
    <div class="preview-container" id="resumePage1">
        <div class="resume-header-flex">
            <div style="flex:1">
                <h1 id="preName" class="resume-name">ALEX CHEN</h1>
                <div class="resume-contact">
                    <span id="preEmail">alex.chen@example.com</span>
                    <span id="prePhoneWrapper">| <span id="prePhone"></span></span>
                    <span id="preMilitaryWrapper" class="hidden">| <span id="preMilitary"></span></span>
                    <span id="preSalaryWrapper">| <span id="textSalaryLabel">期待年薪:</span> <span id="preSalary">800,000</span> TWD</span>
                </div>
            </div>
            <img id="prePhoto" class="photo-view" src="">
        </div>

        <div class="section-header" id="preSummaryHeader">專業概覽</div>
        <div id="preSummary" class="item-desc">請輸入個人簡介...</div>
        <div id="preTags" class="skill-tags-view"></div>

        <div class="section-header" id="preExpHeaderView">工作經歷</div>
        <div id="preExpList"></div>

        <div class="section-header" id="preEduHeaderView">教育背景</div>
        <div id="preEduList"></div>

        <div id="pfSection">
            <div class="section-header" id="prePFHeader">作品集連結</div>
            <div id="prePFList" style="display:flex; flex-direction:column; gap:4px"></div>
        </div>
    </div>
</div>

<script>
    const i18n = {
        zh: {
            display: "介面與顯示設定", lang: "使用英文界面 (English)", showSalary: "顯示期待薪資", showPhoto: "顯示大頭貼", showPF: "顯示作品集網址",
            personal: "個人資訊", name: "姓名", email: "Email", phone: "電話", salaryIn: "期待年薪", military: "兵役狀況（選填）",
            summary: "自我簡介 & 技能", expHeader: "工作經歷", eduHeader: "教育程度", portfolio: "作品集網址",
            salaryPre: "期待年薪:", summaryHeader: "專業概覽", expView: "工作經歷", eduView: "教育背景", pfHeader: "作品集連結",
            phTitle: "職位 / 學位", phOrg: "單位 / 學校", phTime: "年份", phDesc: "成就描述...", noUrl: "尚未設定網址", empty: "(未填寫)",
            pfLabelPh: "名稱（如 GitHub）", pfUrlPh: "https://...", btnAddPF: "+ 新增連結"
        },
        en: {
            display: "Settings", lang: "English UI", showSalary: "Show Salary", showPhoto: "Show Photo", showPF: "Show Portfolio",
            personal: "Personal", name: "Name", email: "Email", phone: "Phone", salaryIn: "Salary", military: "Military Service (optional)",
            summary: "Summary & Skills", expHeader: "Work Experience", eduHeader: "Education", portfolio: "Portfolio URL",
            salaryPre: "Expected Salary:", summaryHeader: "Summary", expView: "Experience", eduView: "Education", pfHeader: "Portfolio",
            phTitle: "Title", phOrg: "Org", phTime: "Period", phDesc: "Details...", noUrl: "Not Set", empty: "(Empty)",
            pfLabelPh: "Label (e.g. GitHub)", pfUrlPh: "https://...", btnAddPF: "+ Add Link"
        }
    };

    // 兵役狀況：中華民國男性求職履歷常見欄位，女性/外籍/未達役齡通常填「不適用」或乾脆留空不顯示
    const militaryOptions = [
        { value: '', zh: '不顯示', en: 'Not Shown' },
        { value: 'completed', zh: '役畢', en: 'Completed' },
        { value: 'exempted', zh: '免役', en: 'Exempted' },
        { value: 'substitute', zh: '替代役', en: 'Alternative Service' },
        { value: 'pending', zh: '尚未服役', en: 'Pending' },
        { value: 'na', zh: '不適用', en: 'N/A' }
    ];

    let skills = ['Java', 'SpringBoot', 'Python'];
    let data = {
        exp: [{ title: 'Backend Developer', org: 'Tech Inc.', time: '2025 - Present', desc: 'API design...' }],
        edu: [{ title: 'B.B.A.', org: 'University', time: '2018 - 2022', desc: 'Major in Biz.' }],
        pf: [{ label: 'GitHub', url: '' }]
    };

    function updateLanguage(isEnglish) {
        const lang = isEnglish ? i18n.en : i18n.zh;
        document.getElementById('labelDisplay').innerText = lang.display;
        document.getElementById('labelTextLang').innerText = lang.lang;
        document.getElementById('labelShowSalary').innerText = lang.showSalary;
        document.getElementById('labelShowPhoto').innerText = lang.showPhoto;
        document.getElementById('labelShowPF').innerText = lang.showPF;
        document.getElementById('labelPersonal').innerText = lang.personal;
        document.getElementById('labelName').innerText = lang.name;
        document.getElementById('labelEmail').innerText = lang.email;
        document.getElementById('labelPhone').innerText = lang.phone;
        document.getElementById('labelSalaryIn').innerText = lang.salaryIn;
        document.getElementById('labelMilitary').innerText = lang.military;
        renderMilitaryOptions();
        updateMilitary(document.getElementById('inputMilitary').value);
        document.getElementById('labelSummaryTitle').innerText = lang.summary;
        document.getElementById('labelExpHeader').innerText = lang.expHeader;
        document.getElementById('labelEduHeader').innerText = lang.eduHeader;
        document.getElementById('labelPortfolio').innerText = lang.portfolio;
        document.getElementById('textSalaryLabel').innerText = lang.salaryPre;
        document.getElementById('preSummaryHeader').innerText = lang.summaryHeader;
        document.getElementById('preExpHeaderView').innerText = lang.expView;
        document.getElementById('preEduHeaderView').innerText = lang.eduView;
        document.getElementById('prePFHeader').innerText = lang.pfHeader;
        document.getElementById('btnAddPF').innerText = lang.btnAddPF;
        renderAll();
    }

    // 換語言時下拉選項文字要重畫，但選到的 value 要保留
    function renderMilitaryOptions() {
        const isEnglish = document.getElementById('langToggle').checked;
        const select = document.getElementById('inputMilitary');
        const current = select.value;
        select.innerHTML = militaryOptions.map(opt => `<option value="${opt.value}">${isEnglish ? opt.en : opt.zh}</option>`).join('');
        select.value = current;
    }

    function updateMilitary(val) {
        const isEnglish = document.getElementById('langToggle').checked;
        const opt = militaryOptions.find(o => o.value === val);
        document.getElementById('preMilitary').innerText = opt ? (isEnglish ? opt.en : opt.zh) : '';
        document.getElementById('preMilitaryWrapper').classList.toggle('hidden', !val);
    }

    function togglePFVisibility(show) { document.getElementById('pfSection').classList.toggle('hidden', !show); }
    function updateThemeColor(color) { document.documentElement.style.setProperty('--primary-dark', color); }
    function sync(id, val) { document.getElementById(id).innerText = val || (document.getElementById('langToggle').checked ? i18n.en.empty : i18n.zh.empty); }
    function updatePhone(val) {
        document.getElementById('prePhone').innerText = val;
        document.getElementById('prePhoneWrapper').classList.toggle('hidden', !val);
    }
    function updateSalary(val) { document.getElementById('preSalary').innerText = val ? Number(val).toLocaleString() : '---'; }
    function toggleSalaryVisibility(show) { document.getElementById('preSalaryWrapper').classList.toggle('hidden', !show); }
    function togglePhotoVisibility(show) { document.getElementById('prePhoto').classList.toggle('active', show && document.getElementById('prePhoto').src); }

    function handlePhoto(input) {
        if (input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = document.getElementById('prePhoto');
                img.src = e.target.result;
                if (document.getElementById('togglePhoto').checked) img.classList.add('active');
                scheduleSave(); // change 事件在 base64 讀完前就觸發，這裡要再存一次才能存到照片
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function addItem(type) { data[type].push({ title: '', org: '', time: '', desc: '' }); renderAll(); scheduleSave(); }
    function removeItem(type, index) { data[type].splice(index, 1); renderAll(); scheduleSave(); }
    function updateItem(type, index, field, val) { data[type][index][field] = val; renderPreviewList(type); }

    function renderAll() {
        renderEditorList('exp'); renderEditorList('edu');
        renderPreviewList('exp'); renderPreviewList('edu');
        renderSkills();
        renderPF();
    }

    function renderEditorList(type) {
        const lang = document.getElementById('langToggle').checked ? i18n.en : i18n.zh;
        document.getElementById(`${type}ListEditor`).innerHTML = data[type].map((item, i) => `
            <div class="dynamic-list-item">
                <span class="btn-remove" onclick="removeItem('${type}', ${i})">✕</span>
                <input type="text" placeholder="${lang.phTitle}" value="${item.title}" oninput="updateItem('${type}', ${i}, 'title', this.value)">
                <input type="text" placeholder="${lang.phOrg}" value="${item.org}" oninput="updateItem('${type}', ${i}, 'org', this.value)">
                <input type="text" placeholder="${lang.phTime}" value="${item.time}" oninput="updateItem('${type}', ${i}, 'time', this.value)">
                <textarea placeholder="${lang.phDesc}" rows="3" oninput="updateItem('${type}', ${i}, 'desc', this.value); autoGrowTextarea(this)">${item.desc}</textarea>
            </div>
        `).join('');
        document.querySelectorAll(`#${type}ListEditor textarea`).forEach(autoGrowTextarea);
    }

    // 描述框內容多行時自動長高，避免固定小高度的 textarea 自己出現內部捲軸，
    // 導致滑鼠移到該欄位時滾輪被它吃掉、無法繼續往下捲動編輯面板
    function autoGrowTextarea(el) {
        el.style.height = 'auto';
        // +2px 緩衝：border-box 下 clientHeight 會比 scrollHeight 少個 1-2px（邊框計算誤差），
        // 沒補這一點會導致「長高後」內容還差最後一絲高度、textarea 仍判定為可捲動而吃掉滾輪
        el.style.height = (el.scrollHeight + 2) + 'px';
    }

    function renderPreviewList(type) {
        // 履歷慣例新到舊：輸入順序仍照你打字的先後（陣列本身不變），
        // 只在預覽時複製一份反轉，index 對應的 removeItem/updateItem 不受影響
        document.getElementById(`pre${type.charAt(0).toUpperCase() + type.slice(1)}List`).innerHTML = [...data[type]].reverse().map(item => `
            <div class="entry-block">
                <div class="item-row"><span>${item.title}</span><span>${item.time}</span></div>
                <div class="item-sub">${item.org}</div>
                <div class="item-desc">${item.desc}</div>
            </div>
        `).join('');
    }

    function renderSkills() {
        const editor = document.getElementById('skillListEditor');
        const tags = document.getElementById('preTags');
        editor.innerHTML = ''; tags.innerHTML = '';
        skills.forEach((skill, index) => {
            const li = document.createElement('li');
            li.className = 'skill-item-editor';
            li.innerHTML = `<span>${skill}</span><span onclick="removeSkill(${index})">✕</span>`;
            editor.appendChild(li);
            const tag = document.createElement('span');
            tag.className = 'skill-tag-resume';
            tag.innerText = skill;
            tags.appendChild(tag);
        });
    }

    function addSkill() { const input = document.getElementById('skillInput'); if (input.value.trim()) { skills.push(input.value.trim()); input.value = ''; renderSkills(); scheduleSave(); } }
    function removeSkill(index) { skills.splice(index, 1); renderSkills(); scheduleSave(); }

    // ===== 作品集連結（可新增多筆） =====
    function addPF() { data.pf.push({ label: '', url: '' }); renderPF(); scheduleSave(); }
    function removePF(index) { data.pf.splice(index, 1); renderPF(); scheduleSave(); }
    function updatePFItem(index, field, val) { data.pf[index][field] = val; renderPFPreview(); }

    function renderPF() { renderPFEditor(); renderPFPreview(); }

    function renderPFEditor() {
        const lang = document.getElementById('langToggle').checked ? i18n.en : i18n.zh;
        document.getElementById('pfListEditor').innerHTML = data.pf.map((item, i) => `
            <div class="dynamic-list-item">
                <span class="btn-remove" onclick="removePF(${i})">✕</span>
                <input type="text" placeholder="${lang.pfLabelPh}" value="${item.label}" oninput="updatePFItem(${i}, 'label', this.value)">
                <input type="text" placeholder="${lang.pfUrlPh}" value="${item.url}" oninput="updatePFItem(${i}, 'url', this.value)">
            </div>
        `).join('');
    }

    // 使用者網址可能沒打 http(s)://，補上才會是可點擊的絕對網址（不然預設會被瀏覽器當成相對路徑）
    function normalizeUrl(url) { return /^https?:\/\//i.test(url) ? url : 'https://' + url; }

    function renderPFPreview() {
        const lang = document.getElementById('langToggle').checked ? i18n.en : i18n.zh;
        const list = data.pf.filter(item => item.url.trim());
        document.getElementById('prePFList').innerHTML = list.length ? list.map(item => `
            <a href="${normalizeUrl(item.url)}" target="_blank" rel="noopener" style="color:var(--accent-color); font-weight:bold; text-decoration:none; font-size:14px">${item.label || item.url}</a>
        `).join('') : `<span style="color:var(--text-light); font-size:13px">${lang.noUrl}</span>`;
    }

    // ===== 自動儲存功能 =====
    // 注意：localStorage 依網域 (origin) 隔離，file:// 本機測試存的資料
    // 不會出現在 GitHub Pages 網站上，反之亦然。
    const STORAGE_KEY = 'resumeEditorData';
    let saveTimer = null;
    let photoWarned = false; // 照片存不進去的提醒，每次開頁面最多跳一次

    // 把目前所有編輯內容收集成一個純物件（也是 JSON 匯出/匯入的共同格式）
    function collectState() {
        const photoSrc = document.getElementById('prePhoto').src;
        return {
            version: 1, // schema 版本，未來格式變更時用來判斷是否需要轉換
            savedAt: new Date().toISOString(),
            settings: {
                themeColor: document.getElementById('colorPicker').value,
                isEnglish: document.getElementById('langToggle').checked,
                showPhoto: document.getElementById('togglePhoto').checked,
                showSalary: document.getElementById('toggleSalary').checked,
                showPF: document.getElementById('togglePF').checked
            },
            profile: {
                name: document.getElementById('inputName').value,
                email: document.getElementById('inputEmail').value,
                phone: document.getElementById('inputPhone').value,
                salary: document.getElementById('inputSalary').value,
                military: document.getElementById('inputMilitary').value,
                summary: document.getElementById('inputSummary').value,
                photo: photoSrc.startsWith('data:') ? photoSrc : null
            },
            skills: skills,
            exp: data.exp,
            edu: data.edu,
            pf: data.pf
        };
    }

    // debounce：輸入停止 500ms 後才真正寫入，避免每敲一個字就存一次
    function scheduleSave() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveState, 500);
    }

    function saveState() {
        try {
            const state = collectState();
            // localStorage 上限約 5MB，照片 base64 太大會塞不下，先做大小防護
            if (state.profile.photo && state.profile.photo.length > 2000000) {
                state.profile.photo = null;
                if (!photoWarned) {
                    photoWarned = true;
                    alert('照片過大，無法自動儲存照片，重新整理後需重新上傳（可改用「匯出備份」保留照片）');
                }
            }
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                // 空間不足 (QuotaExceededError)：去掉照片再試一次
                state.profile.photo = null;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                if (!photoWarned) {
                    photoWarned = true;
                    alert('儲存空間不足，照片未被儲存');
                }
            }
        } catch (e) {
            // localStorage 完全不可用（例如隱私模式）：退化成不儲存，不影響編輯
        }
    }

    // 把儲存的物件寫回畫面。順序重要：先還原陣列，
    // 最後才呼叫 updateLanguage()（它會 renderAll() 用還原後的陣列重繪清單）
    function applyState(saved) {
        skills = saved.skills;
        data.exp = saved.exp;
        data.edu = saved.edu;
        // 舊資料只有單一 pfUrl 欄位：搬進新的 pf 陣列，讓舊備份也能正常匯入
        data.pf = Array.isArray(saved.pf) ? saved.pf : (saved.profile.pfUrl ? [{ label: 'Portfolio', url: saved.profile.pfUrl }] : []);

        document.getElementById('inputName').value = saved.profile.name;
        document.getElementById('inputEmail').value = saved.profile.email;
        document.getElementById('inputPhone').value = saved.profile.phone || '';
        document.getElementById('inputSalary').value = saved.profile.salary;
        document.getElementById('inputSummary').value = saved.profile.summary;
        renderMilitaryOptions();
        document.getElementById('inputMilitary').value = saved.profile.military || '';
        document.getElementById('colorPicker').value = saved.settings.themeColor;
        document.getElementById('langToggle').checked = saved.settings.isEnglish;
        document.getElementById('togglePhoto').checked = saved.settings.showPhoto;
        document.getElementById('toggleSalary').checked = saved.settings.showSalary;
        document.getElementById('togglePF').checked = saved.settings.showPF;

        updateThemeColor(saved.settings.themeColor);
        sync('preName', saved.profile.name);
        sync('preEmail', saved.profile.email);
        updatePhone(saved.profile.phone || '');
        sync('preSummary', saved.profile.summary);
        updateSalary(saved.profile.salary);
        if (saved.profile.photo) document.getElementById('prePhoto').src = saved.profile.photo;
        togglePhotoVisibility(saved.settings.showPhoto);
        toggleSalaryVisibility(saved.settings.showSalary);
        togglePFVisibility(saved.settings.showPF);
        updateLanguage(saved.settings.isEnglish);
    }

    function loadState() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) { updatePhone(''); updateLanguage(false); return; } // 第一次使用：載入預設值
            const saved = JSON.parse(raw);
            if (saved.version !== 1) throw new Error('unknown version');
            applyState(saved);
        } catch (e) {
            // 資料損毀或版本不符：清掉舊資料，改用預設值（絕不能讓頁面掛掉）
            try { localStorage.removeItem(STORAGE_KEY); } catch (e2) {}
            updatePhone('');
            updateLanguage(false);
        }
    }

    function clearAllData() {
        if (confirm('確定要清除所有資料嗎？此動作無法復原。')) {
            localStorage.removeItem(STORAGE_KEY);
            location.reload();
        }
    }

    // ===== JSON 匯出 / 匯入 =====
    // 匯出檔沒有 localStorage 的 5MB 限制，所以永遠包含照片
    // （照片太大存不進 localStorage 時，匯出備份就是保留照片的方法）
    function exportJSON() {
        const blob = new Blob([JSON.stringify(collectState(), null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const d = new Date();
        const stamp = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
        a.href = url;
        a.download = 'resume-backup-' + stamp + '.json';
        a.click();
        URL.revokeObjectURL(url); // 釋放暫時的物件 URL，避免記憶體洩漏
    }

    function importJSON(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            try {
                const parsed = JSON.parse(e.target.result);
                // 基本格式驗證：版本要對、三個清單必須是陣列
                if (parsed.version !== 1 || !Array.isArray(parsed.skills) ||
                    !Array.isArray(parsed.exp) || !Array.isArray(parsed.edu)) {
                    throw new Error('bad format');
                }
                if (confirm('匯入將覆蓋目前內容，確定？')) {
                    applyState(parsed);
                    saveState(); // 匯入後立刻寫進 localStorage，重新整理也不會掉
                }
            } catch (err) {
                alert('檔案格式錯誤，無法匯入');
            }
            input.value = ''; // 重設 file input，讓同一個檔案可以再次匯入
        };
        reader.readAsText(file);
    }

    // 事件委派：在左側面板掛一組 listener，涵蓋所有輸入框
    // （包含之後動態產生的經歷/教育欄位），inline handler 完全不用改
    const editorPanel = document.querySelector('.editor-panel');
    editorPanel.addEventListener('input', scheduleSave);
    editorPanel.addEventListener('change', scheduleSave);

    loadState();
</script>
</body>
</html>
